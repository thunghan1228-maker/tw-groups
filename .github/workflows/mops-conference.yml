# 法人說明會一覽表鏡像（研究室「國際大事行事曆」的法說會，2026-10-10 使用者：全部上市櫃公司法說自動上行事曆）。
# 公開資訊觀測站「法人說明會一覽表」（ajax_t100sb02_1，上市／上櫃、年度、月份）：公司代號、名稱、日期（可能是區間）、時間、地點、擇要訊息。
# 觀測站擋 HanStock 的正式站主機，GitHub 的 runner 抓得到：每天抓上個月、這個月、下個月，整份存 data 分支 tpex/conference.json，
# 再戳後端立刻重抓行事曆。
name: MOPS conference mirror

on:
  schedule:
    - cron: "30 23 * * *"   # 07:30 台北
    - cron: "30 11 * * *"   # 19:30 台北
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-branch-mops-conference   # 各自排隊：共用一個群組時 GitHub 只留一個等待中，會互相取消（2026-10-10）
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data
      - name: 抓法人說明會一覽表（上市、上櫃，上個月～下個月）
        run: |
          python3 - <<'PY'
          import html, json, os, re, time, urllib.parse, urllib.request
          from datetime import date, datetime, timedelta, timezone
          tw = timezone(timedelta(hours=8))
          now = datetime.now(tw)
          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/128.0 Safari/537.36'
          TR = re.compile(r'<tr[^>]*>(.*?)</tr>', re.S | re.I)
          TD = re.compile(r'<td[^>]*>(.*?)</td>', re.S | re.I)
          DATE = re.compile(r'(\d{2,3})/(\d{1,2})/(\d{1,2})')

          def clean(cell):
              return re.sub(r'\s+', ' ', html.unescape(re.sub(r'<[^>]+>', ' ', cell))).strip()

          def roc(text):
              m = DATE.search(text or '')
              return f'{int(m.group(1)) + 1911:04d}-{int(m.group(2)):02d}-{int(m.group(3)):02d}' if m else None

          def month_list():
              first = now.date().replace(day=1)
              prev = (first - timedelta(days=1)).replace(day=1)
              nxt = (first + timedelta(days=32)).replace(day=1)
              return [prev, first, nxt]

          rows, seen = [], set()
          for m in month_list():
              for typek, market in (('sii', 'TSE'), ('otc', 'OTC')):
                  body = urllib.parse.urlencode({'encodeURIComponent': '1', 'step': '1', 'firstin': '1', 'off': '1', 'TYPEK': typek,
                                                 'year': str(m.year - 1911), 'month': f'{m.month:02d}', 'co_id': ''}).encode()
                  req = urllib.request.Request('https://mopsov.twse.com.tw/mops/web/ajax_t100sb02_1', data=body, headers={
                      'User-Agent': UA, 'Content-Type': 'application/x-www-form-urlencoded', 'Referer': 'https://mopsov.twse.com.tw/mops/web/t100sb02_1'})
                  text = ''
                  for attempt in range(3):
                      try:
                          with urllib.request.urlopen(req, timeout=60) as r:
                              text = r.read().decode('utf-8', errors='replace')
                          break
                      except Exception as e:
                          print('retry', m, typek, type(e).__name__, e)
                          time.sleep(5 * (attempt + 1))
                  got = 0
                  for tr in TR.finditer(text):
                      cells = [clean(c) for c in TD.findall(tr.group(1))]
                      if len(cells) < 6 or not re.fullmatch(r'[0-9A-Z]{4,6}', cells[0]):
                          continue
                      dates = DATE.findall(cells[2])
                      start = roc(cells[2])
                      end = roc('/'.join(dates[-1])) if len(dates) > 1 else start
                      if not start:
                          continue
                      key = (cells[0], start, cells[3])
                      if key in seen:
                          continue
                      seen.add(key)
                      # 代號、名稱、市場、開始日、結束日、時間、地點、擇要訊息
                      rows.append([cells[0], cells[1], market, start, end, cells[3], cells[4][:80], cells[5][:220]])
                      got += 1
                  print(m.isoformat()[:7], typek, got)
                  time.sleep(2)
          if rows:
              rows.sort(key=lambda r: (r[3], r[5], r[0]))
              os.makedirs('tpex', exist_ok=True)
              json.dump({'updated': now.isoformat(timespec='minutes'), 'fields': ['code', 'name', 'market', 'start', 'end', 'time', 'place', 'summary'],
                         'rows': rows}, open('tpex/conference.json', 'w', encoding='utf-8'), ensure_ascii=False, separators=(',', ':'))
          print('總共', len(rows))
          PY
      - name: 推到 data 分支
        run: |
          git config user.name "conference-mirror"
          git config user.email "conference-mirror@users.noreply.github.com"
          git add tpex/conference.json
          git commit -m "法人說明會一覽表鏡像 $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "沒有變動"; exit 0; }
          for i in 1 2 3 4; do git pull --rebase origin data && git push && break; sleep $((i * 5)); done
      - name: 戳後端立刻重抓行事曆
        run: |
          curl -sS -X POST --max-time 120 "https://hanstock-production-b872.up.railway.app/api/hub/macro-calendar/fetch" -o /tmp/mc.json -w "HTTP %{http_code}\n" || true
          head -c 600 /tmp/mc.json; echo
