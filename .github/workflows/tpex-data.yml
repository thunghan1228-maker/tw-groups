# 上櫃資料鏡像（三大法人、本益比、月營收、基本資料、集保股權分散）：櫃買中心擋 HanStock 的正式站主機（Railway）和 Cloudflare，
# 但 GitHub 的 runner 抓得到。每個交易日 16:40（台北）把櫃買中心開放資料
# tpex_3insti_daily_trading（最新一天）抓下來，推到這個 repo 的 data 分支（不部署），
# 再戳後端立刻拉回去。手動跑時可以填「回補幾天」，用櫃買中心的指定日期查詢
# （insti/dailyTrade）把過去的日子一天一份補進來，格式轉成跟開放資料一樣。
name: TPEx data mirror

on:
  schedule:
    - cron: "40 8 * * 1-5"   # 16:40 台北時間（UTC+8）
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "回補最近幾個工作日（0＝只抓最新一天）"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data
      - name: 抓櫃買中心三大法人（最新一天）
        run: |
          curl -sS --max-time 90 -H "Accept: application/json" -H "Accept-Language: zh-TW,zh;q=0.9" \
            -H "User-Agent: Mozilla/5.0 (compatible; HanStock-mirror/1.0)" \
            "https://www.tpex.org.tw/openapi/v1/tpex_3insti_daily_trading" -o /tmp/3insti.json -w "HTTP %{http_code}\n"
          python3 - <<'PY'
          import json, os
          rows = json.load(open('/tmp/3insti.json', encoding='utf-8'))
          assert isinstance(rows, list) and len(rows) >= 600, f"rows={len(rows) if isinstance(rows, list) else type(rows)}"
          roc = str(rows[0].get('Date', ''))
          assert len(roc) == 7 and roc.isdigit(), roc
          iso = f"{int(roc[:3]) + 1911}-{roc[3:5]}-{roc[5:7]}"
          os.makedirs('tpex', exist_ok=True)
          text = json.dumps(rows, ensure_ascii=False, separators=(',', ':'))
          open('tpex/3insti-latest.json', 'w', encoding='utf-8').write(text)
          open(f'tpex/3insti-{iso}.json', 'w', encoding='utf-8').write(text)
          try:
              index = json.load(open('tpex/index.json', encoding='utf-8'))
          except Exception:
              index = []
          index = sorted(set(index) | {iso}, reverse=True)[:60]
          json.dump(index, open('tpex/index.json', 'w', encoding='utf-8'))
          print('date', iso, 'rows', len(rows))
          PY
      - name: 回補過去的日子（指定日期查詢）
        if: ${{ inputs.backfill_days != '' && inputs.backfill_days != '0' }}
        env:
          BACKFILL_DAYS: ${{ inputs.backfill_days }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          from datetime import date, timedelta
          days = int(os.environ.get('BACKFILL_DAYS', '0') or 0)
          try:
              index = set(json.load(open('tpex/index.json', encoding='utf-8')))
          except Exception:
              index = set()
          def fetch(day):
              url = f"https://www.tpex.org.tw/www/zh-tw/insti/dailyTrade?type=Daily&sect=EW&date={day:%Y/%m/%d}&response=json"
              req = urllib.request.Request(url, headers={'Accept': 'application/json', 'Accept-Language': 'zh-TW,zh;q=0.9',
                                                         'User-Agent': 'Mozilla/5.0 (compatible; HanStock-mirror/1.0)', 'Referer': 'https://www.tpex.org.tw/'})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.load(r)
          def num(v):
              try:
                  return int(float(str(v).replace(',', '').strip() or 0))
              except ValueError:
                  return 0
          # 指定日期查詢的欄位是固定位置：0 代號 1 名稱 | 2-4 外資不含自營商 | 5-7 外資自營商 | 8-10 外資合計 |
          # 11-13 投信 | 14-16 自營自行 | 17-19 自營避險 | 20-22 自營合計 | 23 三大法人合計（買進/賣出/買賣超）
          cursor = date.today()
          checked = 0
          added = []
          while checked < days and (date.today() - cursor).days < days * 2 + 14:
              cursor -= timedelta(days=1)
              if cursor.weekday() >= 5:
                  continue
              checked += 1
              iso = cursor.isoformat()
              if iso in index:
                  continue
              try:
                  payload = fetch(cursor)
              except Exception as e:
                  print('skip', iso, type(e).__name__, e)
                  time.sleep(3)
                  continue
              tables = payload.get('tables') or []
              data = tables[0].get('data') if tables else None
              if not data or len(data) < 600:
                  print('no data', iso, len(data or []))
                  time.sleep(3)
                  continue
              roc = f"{cursor.year - 1911:03d}{cursor.month:02d}{cursor.day:02d}"
              rows = []
              for row in data:
                  if len(row) < 24:
                      continue
                  rows.append({'Date': roc, 'SecuritiesCompanyCode': str(row[0]).strip(), 'CompanyName': str(row[1]).strip(),
                               'Foreign Investors include Mainland Area Investors (Foreign Dealers excluded)-Difference': str(num(row[4])),
                               'ForeignDealers-Difference': str(num(row[7])),
                               'ForeignInvestorsInclude MainlandAreaInvestors-Difference': str(num(row[10])),
                               'SecuritiesInvestmentTrustCompanies-Difference': str(num(row[13])),
                               'Dealers-Difference': str(num(row[22])), 'TotalDifference': str(num(row[23]))})
              open(f'tpex/3insti-{iso}.json', 'w', encoding='utf-8').write(json.dumps(rows, ensure_ascii=False, separators=(',', ':')))
              index.add(iso)
              added.append((iso, len(rows)))
              print('saved', iso, len(rows))
              time.sleep(3)
          json.dump(sorted(index, reverse=True)[:60], open('tpex/index.json', 'w', encoding='utf-8'))
          print('added', added)
          PY
      - name: 抓本益比、月營收、基本資料與集保股權分散（波段日報第二階段）
        run: |
          python3 - <<'PY'
          import csv, io, json, os, urllib.request
          H = {'Accept': 'application/json, text/plain, */*', 'Accept-Language': 'zh-TW,zh;q=0.9',
               'User-Agent': 'Mozilla/5.0 (compatible; HanStock-mirror/1.0)', 'Referer': 'https://www.tpex.org.tw/'}
          def get(url, timeout=120):
              with urllib.request.urlopen(urllib.request.Request(url, headers=H), timeout=timeout) as r:
                  return r.read()
          def get_json(url):
              return json.loads(get(url).decode('utf-8'))
          os.makedirs('tpex', exist_ok=True)
          # 族群股票代號（只留這些，檔案才小）
          codes = set()
          try:
              groups = get_json('https://tw-groups.judystock.workers.dev/api/groups').get('groups') or []
              for g in groups:
                  for s in g.get('stocks') or []:
                      codes.add(str(s.get('code', '')).strip().upper())
          except Exception as e:
              print('groups fetch failed', e)
          print('universe codes', len(codes))
          def code_of(item):
              return str(item.get('公司代號') or item.get('SecuritiesCompanyCode') or '').strip().upper()
          # 上櫃本益比（整份不大，照存）
          try:
              rows = get_json('https://www.tpex.org.tw/openapi/v1/tpex_mainboard_peratio_analysis')
              assert isinstance(rows, list) and len(rows) > 300, len(rows)
              json.dump(rows, open('tpex/peratio-latest.json', 'w', encoding='utf-8'), ensure_ascii=False, separators=(',', ':'))
              print('peratio rows', len(rows), rows[0].get('Date'))
          except Exception as e:
              print('peratio failed', type(e).__name__, e)
          # 上櫃月營收（只留族群股票）
          try:
              rows = get_json('https://www.tpex.org.tw/openapi/v1/mopsfin_t187ap05_O')
              keep = [r for r in rows if not codes or code_of(r) in codes]
              assert keep, 'no revenue rows'
              json.dump(keep, open('tpex/revenue-latest.json', 'w', encoding='utf-8'), ensure_ascii=False, separators=(',', ':'))
              print('revenue rows', len(keep), keep[0].get('資料年月'))
          except Exception as e:
              print('revenue failed', type(e).__name__, e)
          # 上櫃基本資料：只留代號、名稱、已發行普通股數
          try:
              rows = get_json('https://www.tpex.org.tw/openapi/v1/mopsfin_t187ap03_O')
              keep = []
              for r in rows:
                  c = code_of(r)
                  if codes and c not in codes:
                      continue
                  # 櫃買中心這份是英文欄位（IssueShares／CompanyAbbreviation），證交所那份才是中文欄位
                  shares = r.get('IssueShares') or next((v for k, v in r.items() if '已發行普通股數' in str(k)), None)
                  if c and shares:
                      keep.append({'公司代號': c, '公司簡稱': r.get('公司簡稱') or r.get('CompanyAbbreviation') or r.get('CompanyName') or '', '已發行普通股數或TDR原股發行股數': str(shares)})
              assert keep, 'no basics rows'
              json.dump(keep, open('tpex/basics-latest.json', 'w', encoding='utf-8'), ensure_ascii=False, separators=(',', ':'))
              print('basics rows', len(keep))
          except Exception as e:
              print('basics failed', type(e).__name__, e)
          # 集保股權分散（每週）：整份過濾成族群股票，一週一份
          try:
              raw = get('https://opendata.tdcc.com.tw/getOD.ashx?id=1-5', timeout=300).decode('utf-8-sig', errors='replace')
              reader = csv.reader(io.StringIO(raw))
              header = next(reader)
              day = None
              rows = []
              for row in reader:
                  if len(row) < 6:
                      continue
                  d, code, level, holders, shares, pct = row[:6]
                  code = code.strip().upper()
                  if codes and code not in codes:
                      continue
                  day = day or (f"{d[:4]}-{d[4:6]}-{d[6:8]}" if len(d) == 8 else d)
                  rows.append([code, int(level), int(holders.replace(',', '')), int(shares.replace(',', '')), float(pct)])
              assert day and len(rows) > 100, f"day={day} rows={len(rows)}"
              path = f'tpex/tdcc-{day}.json'
              if not os.path.exists(path):
                  json.dump({'date': day, 'rows': rows}, open(path, 'w', encoding='utf-8'), ensure_ascii=False, separators=(',', ':'))
                  print('tdcc saved', day, len(rows))
              else:
                  print('tdcc already have', day)
              try:
                  index = json.load(open('tpex/tdcc-index.json', encoding='utf-8'))
              except Exception:
                  index = []
              index = sorted(set(index) | {day}, reverse=True)[:20]
              json.dump(index, open('tpex/tdcc-index.json', 'w', encoding='utf-8'))
          except Exception as e:
              print('tdcc failed', type(e).__name__, e)
          PY
      - name: 推到 data 分支
        run: |
          git config user.name "tpex-mirror"
          git config user.email "tpex-mirror@users.noreply.github.com"
          git add tpex
          git commit -m "上櫃三大法人鏡像 $(date -u +%Y-%m-%dT%H:%MZ)" || echo "沒有變動"
          git push
      - name: 戳後端立刻拉回去
        run: |
          curl -sS -X POST --max-time 170 "https://hanstock-production-b872.up.railway.app/api/hub/chips/collect" -o /tmp/collect.json -w "HTTP %{http_code}\n" || true
          head -c 3000 /tmp/collect.json; echo
          curl -sS -X POST --max-time 170 "https://hanstock-production-b872.up.railway.app/api/hub/fundamentals/collect" -o /tmp/fund.json -w "HTTP %{http_code}\n" || true
          head -c 3000 /tmp/fund.json; echo
