# 每月營收彙總表鏡像（營收成長榜用，2026-10-09 使用者：照莊爸「每月營收成長榜」做一模一樣的）。
# 公開資訊觀測站「每月營業收入彙總表」只有當月陸續公布的最新狀態，沒有每家公司的公布日期；證交所／櫃買的開放資料
# 要到月中才換月（10/09 還停在 8 月營收）。所以跟莊爸一樣每天抓三次（12:30／18:30／23:30），每家公司第一次出現的
# 時間就當公布日，記在 tpex/revenue-seen-YYYY-MM.json（只增不改）；營收數字整份存 tpex/revenue-mops-YYYY-MM.json。
# 觀測站擋 HanStock 的正式站主機，GitHub 的 runner 抓得到。抓完戳後端立刻拉回去。
name: MOPS revenue mirror

on:
  schedule:
    - cron: "30 4 * * *"    # 12:30 台北
    - cron: "30 10 * * *"   # 18:30
    - cron: "30 15 * * *"   # 23:30
  workflow_dispatch:
    inputs:
      months:
        description: "另外補抓哪些月份（YYYY-MM，逗號分隔；只存營收數字、不記公布日）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: data-branch-revenue-mops   # 各自排隊：共用一個群組時 GitHub 只留一個等待中，會互相取消（2026-10-10）
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data
      - name: 抓觀測站每月營收彙總表（上市、上櫃，國內＋國外）
        env:
          EXTRA_MONTHS: ${{ inputs.months }}
        run: |
          python3 - <<'PY'
          import html, json, os, re, time, urllib.error, urllib.request
          from datetime import datetime, timedelta, timezone
          tw = timezone(timedelta(hours=8))
          now = datetime.now(tw)
          stamp = now.isoformat(timespec='minutes')
          headers = {'User-Agent': 'Mozilla/5.0 (compatible; HanStock-mirror/1.0)', 'Accept-Language': 'zh-TW,zh;q=0.9'}

          def get(url):
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=90) as r:
                          return r.read()
                  except urllib.error.HTTPError as e:
                      if e.code == 404:
                          return b''
                      print('retry', url, e)
                  except Exception as e:
                      print('retry', url, type(e).__name__, e)
                  time.sleep(5 * (attempt + 1))
              raise RuntimeError(url)

          def num(cell):
              text = re.sub(r'<[^>]+>', '', cell).replace(',', '').replace('&nbsp;', '').strip()
              try:
                  return float(text)
              except ValueError:
                  return None

          ROW = re.compile(r"<tr align=right><td align=center>\s*([0-9A-Z]{4,6})\s*</td><td align=left>(.*?)</td>(.*?)</tr>", re.S | re.I)
          CELL = re.compile(r"<td[^>]*>(.*?)</td>", re.S | re.I)
          INDUSTRY = re.compile(r"產業別：([^<]+)<")
          PUBLISHED = re.compile(r"出表日期：\s*([\d/]+)\s*(?:<!--\s*([\d:]+)\s*-->)?")

          def parse(text, market):
              heads = [(m.start(), m.group(1).strip()) for m in INDUSTRY.finditer(text)]
              rows = []
              for m in ROW.finditer(text):
                  industry = ''
                  for pos, name in heads:
                      if pos > m.start():
                          break
                      industry = name
                  cells = CELL.findall(m.group(3))
                  if len(cells) < 9:
                      continue
                  note = html.unescape(re.sub(r'<[^>]+>', '', cells[8])).strip()
                  name = html.unescape(re.sub(r'<[^>]+>', '', m.group(2))).strip()
                  rows.append([m.group(1), name, market, industry] + [num(c) for c in cells[:8]] + [None if note in ('', '-') else note])
              pub = PUBLISHED.search(text)
              return rows, ((pub.group(1) + (' ' + pub.group(2) if pub.group(2) else '')) if pub else None)

          first = now.date().replace(day=1)
          last = first - timedelta(days=1)
          target = f'{last.year:04d}-{last.month:02d}'   # 這個月陸續公布的是上個月的營收
          extra = [m.strip() for m in (os.environ.get('EXTRA_MONTHS') or '').split(',') if re.fullmatch(r'\d{4}-\d{2}', m.strip())]
          os.makedirs('tpex', exist_ok=True)
          for month in [target] + [m for m in extra if m != target]:
              year, mon = map(int, month.split('-'))
              rows, pubs = [], {}
              for market, folder in (('TSE', 'sii'), ('OTC', 'otc')):
                  for kind in (0, 1):   # 0 國內公司、1 國外（KY）
                      raw = get(f'https://mopsov.twse.com.tw/nas/t21/{folder}/t21sc03_{year - 1911}_{mon}_{kind}.html')
                      got, pub = parse(raw.decode('cp950', errors='replace'), market) if raw else ([], None)
                      rows += got
                      if pub:
                          pubs[f'{folder}{kind}'] = pub
                      print(month, folder, kind, 'rows', len(got), 'published', pub)
                      time.sleep(1.5)
              uniq, codes = [], set()
              for r in rows:
                  if r[0] not in codes:
                      codes.add(r[0])
                      uniq.append(r)
              if not uniq:
                  print('沒有資料', month)
                  continue
              out = {'month': month, 'fetched': stamp, 'published': pubs,
                     'fields': ['code', 'name', 'market', 'industry', 'rev', 'prevRev', 'lastYearRev', 'momPct', 'yoyPct',
                                'cumRev', 'cumLastYearRev', 'cumPct', 'note'],
                     'rows': uniq}
              json.dump(out, open(f'tpex/revenue-mops-{month}.json', 'w', encoding='utf-8'), ensure_ascii=False, separators=(',', ':'))
              if month == target:
                  # 第一次出現的時間＝公布日（只增不改）；baseline＝這個月第一次抓的時間，那次就已經在的公司公布日不確定
                  path = f'tpex/revenue-seen-{month}.json'
                  seen = json.load(open(path, encoding='utf-8')) if os.path.exists(path) else {'month': month, 'baseline': stamp, 'first': {}}
                  added = [r[0] for r in uniq if r[0] not in seen['first']]
                  for code in added:
                      seen['first'][code] = stamp
                  seen['updated'] = stamp
                  json.dump(seen, open(path, 'w', encoding='utf-8'), ensure_ascii=False, separators=(',', ':'))
                  print(month, 'rows', len(uniq), '新出現', len(added))
          months = sorted({f[13:20] for f in os.listdir('tpex') if f.startswith('revenue-mops-') and f.endswith('.json')}, reverse=True)
          json.dump({'months': months, 'updated': stamp}, open('tpex/revenue-index.json', 'w', encoding='utf-8'), separators=(',', ':'))
          PY
      - name: 推到 data 分支
        run: |
          git config user.name "revenue-mirror"
          git config user.email "revenue-mirror@users.noreply.github.com"
          git add tpex/revenue-*.json
          git commit -m "每月營收彙總表鏡像 $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "沒有變動"; exit 0; }
          for i in 1 2 3 4; do git pull --rebase origin data && git push && break; sleep $((i * 5)); done
      - name: 戳後端立刻拉回去
        run: |
          curl -sS -X POST --max-time 170 "https://hanstock-production-b872.up.railway.app/api/hub/revenue/collect" -o /tmp/rev.json -w "HTTP %{http_code}\n" || true
          head -c 1500 /tmp/rev.json; echo
