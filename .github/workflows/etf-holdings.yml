name: Active ETF holdings mirror

# 主動式 ETF 五檔每日持股鏡像（下午報第三階段，2026-09-26 使用者）：
# 統一投信（00981A、00403A）、復華投信（00991A）、群益投信（00982A、00992A）各自的網站
# 都有公告每日持股的資料介面，但格式不一樣、也不一定讓正式站主機連。這裡在 GitHub runner
# 上抓下來整理成同一種格式：tpex/etf-YYYY-MM-DD.json（{"date","etfs":{代號:{name,issuer,
# source,nav,units,rows:[[股票代號,名稱,股數,權重%],...]}}}）＋ tpex/etf-index.json（日期清單），
# 推到 data 分支，再戳後端拉回去。每個交易日 21:05 與 22:35（台北）各跑一次，晚到的補上。
# 手動跑可以填「回補幾天」，往前逐日抓（投信的介面都能指定日期）。
on:
  schedule:
    - cron: "5 13 * * 1-5"
    - cron: "35 14 * * 1-5"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "回補幾個日曆日（0＝只抓最新一天）"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data
      - name: 抓五檔主動式 ETF 的持股
        env:
          BACKFILL_DAYS: ${{ inputs.backfill_days || '0' }}
        run: |
          python3 - <<'PY'
          import json, os, re, time, urllib.request, urllib.error, urllib.parse
          from datetime import datetime, timedelta, timezone

          TW = timezone(timedelta(hours=8))
          today = datetime.now(TW).date()
          backfill = int(os.environ.get('BACKFILL_DAYS') or '0')
          days = [today - timedelta(days=i) for i in range(backfill, -1, -1)]
          days = [d for d in days if d.weekday() < 5]
          os.makedirs('tpex', exist_ok=True)
          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36'

          class _NoRedirect(urllib.request.HTTPRedirectHandler):
              # urllib 不會幫 POST 跟 307／308 轉址（統一投信的介面會先 307 到同一個網址並給 cookie），自己接手
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          _opener = urllib.request.build_opener(_NoRedirect)

          def http(url, data=None, headers=None, timeout=60, retries=3):
              last = None
              for i in range(retries):
                  try:
                      body = json.dumps(data).encode('utf-8') if data is not None else None
                      cookie = None
                      target = url
                      for _hop in range(4):
                          h = {'User-Agent': UA, **(headers or {})}
                          if cookie:
                              h['Cookie'] = cookie
                          req = urllib.request.Request(target, data=body, headers=h, method='POST' if data is not None else 'GET')
                          try:
                              with _opener.open(req, timeout=timeout) as r:
                                  return json.loads(r.read().decode('utf-8'))
                          except urllib.error.HTTPError as e:
                              if e.code in (301, 302, 303, 307, 308) and e.headers.get('Location'):
                                  target = urllib.parse.urljoin(target, e.headers['Location'])
                                  set_cookie = e.headers.get_all('Set-Cookie') or []
                                  if set_cookie:
                                      cookie = '; '.join(c.split(';', 1)[0] for c in set_cookie)
                                  continue
                              raise
                      raise RuntimeError('too many redirects')
                  except Exception as e:  # noqa: BLE001
                      last = e
                      time.sleep(4 * (i + 1))
              raise last

          def roc(d):
              return f"{d.year - 1911}/{d.month:02d}/{d.day:02d}"

          def ms_date(v):
              """統一的日期：'/Date(1790179200000)/'（台北午夜的 UTC 毫秒）或 ISO 字串。"""
              s = str(v or '')
              m = re.search(r'Date\((-?\d+)\)', s)
              if m:
                  return (datetime.fromtimestamp(int(m.group(1)) / 1000, timezone.utc) + timedelta(hours=8)).date().isoformat()
              return s[:10].replace('/', '-') if len(s) >= 10 else None

          # ---- 統一投信：POST GetPCF；specificDate=false 取最新；true 時 date 有時對到公告日、有時對到持股日，
          #      所以往後多試幾天，取 TranDate（持股日）等於要的那天的 ----
          def _ezmoney_call(fund_code, day, specific):
              body = {'fundCode': fund_code, 'date': roc(day), 'specificDate': specific}
              j = http('https://www.ezmoney.com.tw/ETF/Transaction/GetPCF', body, {
                  'Content-Type': 'application/json; charset=UTF-8', 'X-Requested-With': 'XMLHttpRequest',
                  'Accept': 'application/json, text/javascript, */*; q=0.01', 'Referer': 'https://www.ezmoney.com.tw/ETF/Transaction/PCF'})
              pcf = j.get('pcf') or []
              date = ms_date(pcf[0].get('TranDate')) if pcf else None
              st = next((a for a in (j.get('asset') or []) if a.get('AssetCode') == 'ST'), None)
              rows = [[str(d.get('DetailCode')).strip(), str(d.get('DetailName') or '').strip(), int(d.get('Share') or 0), float(d.get('NavRate') or 0)]
                      for d in (st.get('Details') if st else []) if d.get('DetailCode')]
              nav = next((p.get('Amount') for p in pcf if p.get('PCFCode') == 'NAV'), None)
              units = next((p.get('Amount') for p in pcf if p.get('PCFCode') == 'OUT_UNIT'), None)
              return date, {'source': 'ezmoney', 'nav': nav, 'units': units, 'rows': rows}

          def fetch_ezmoney(fund_code, day, latest):
              if latest:
                  return _ezmoney_call(fund_code, day, False)
              for offset in range(0, 5):
                  date, item = _ezmoney_call(fund_code, day + timedelta(days=offset), True)
                  if date == day.isoformat() and item['rows']:
                      return date, item
                  time.sleep(1)
              return None, {'source': 'ezmoney', 'nav': None, 'units': None, 'rows': []}

          # ---- 復華投信：GET assets?fundID=&qDate=YYYY/MM/DD（非營業日回空） ----
          def fetch_fhtrust(fund_id, day, latest):
              j = http(f'https://www.fhtrust.com.tw/api/assets?fundID={fund_id}&qDate={day.strftime("%Y/%m/%d")}', None, {'Accept': 'application/json'})
              res = (j.get('result') or [{}])[0] or {}
              date = str(res.get('dDate') or '').replace('/', '-') or None
              rows = [[str(d.get('stockid')).strip(), str(d.get('stockname') or '').strip(), int(str(d.get('qshare') or '0').replace(',', '')), float(str(d.get('prate_addaccint') or '0').replace('%', ''))]
                      for d in (res.get('detail') or []) if d.get('ftype') == '股票' and d.get('stockid')]
              nav = float(str(res.get('pcf_FundNav') or '0').replace(',', '')) or None
              units = float(str(res.get('pcf_FundQissue') or '0').replace(',', '')) or None
              return date, {'source': 'fhtrust', 'nav': nav, 'units': units, 'rows': rows}

          # ---- 群益投信：POST buyback {fundId, date}；date=null 取最新；date 是公告日（date1），
          #      持股日是 date2（前一個營業日），要某天的持股就把公告日往後試幾天 ----
          def _capital_call(fund_no, date_str):
              body = {'fundId': fund_no, 'date': date_str}
              j = http('https://www.capitalfund.com.tw/CFWeb/api/etf/buyback', body, {
                  'Content-Type': 'application/json', 'Accept': 'application/json',
                  'Referer': f'https://www.capitalfund.com.tw/etf/product/detail/{fund_no}/portfolio', 'Origin': 'https://www.capitalfund.com.tw'}, timeout=90)
              d = j.get('data') or {}
              pcf = d.get('pcf') or {}
              date = str(pcf.get('date2') or '')[:10].replace('/', '-') or None
              rows = [[str(s.get('stocNo')).strip(), str(s.get('stocName') or '').strip(), int(s.get('share') or 0), float(s.get('weight') or 0)]
                      for s in (d.get('stocks') or []) if s.get('stocNo')]
              return date, {'source': 'capitalfund', 'nav': pcf.get('nav'), 'units': pcf.get('totUnit'), 'rows': rows}

          def fetch_capital(fund_no, day, latest):
              if latest:
                  return _capital_call(fund_no, None)
              for offset in range(1, 7):
                  date, item = _capital_call(fund_no, (day + timedelta(days=offset)).strftime('%Y-%m-%d'))
                  if date == day.isoformat() and item['rows']:
                      return date, item
                  time.sleep(1)
              return None, {'source': 'capitalfund', 'nav': None, 'units': None, 'rows': []}

          # ---- 備援：zdsetf.com 的整理頁（各投信介面掛掉時才用） ----
          def fetch_fallback(code):
              req = urllib.request.Request(f'https://zdsetf.com/etf/{code}', headers={'User-Agent': UA})
              with urllib.request.urlopen(req, timeout=60) as r:
                  html = r.read().decode('utf-8', errors='replace')
              m = re.search(r'資料日 (\d{4}-\d{2}-\d{2})', html)
              date = m.group(1) if m else None
              sec = html[html.find('data-tab="all"'):]
              rows = [[c, n, int(sh.replace(',', '')), float(w)] for c, n, sh, w in re.findall(
                  r'<tr class="clickable" data-href="/stock/(\w+)">\s*<td>\w+</td>\s*<td>([^<]+)</td>\s*<td class="num">([\d,]+)</td>\s*<td class="num">([\d.]+)</td>', sec)]
              return date, {'source': 'zdsetf', 'nav': None, 'units': None, 'rows': rows}

          ETFS = [
              ('00981A', '主動統一台股增長', '統一投信', lambda day, latest: fetch_ezmoney('49YTW', day, latest)),
              ('00403A', '主動統一升級50', '統一投信', lambda day, latest: fetch_ezmoney('63YTW', day, latest)),
              ('00991A', '主動復華未來50', '復華投信', lambda day, latest: fetch_fhtrust('ETF23', day, latest)),
              ('00982A', '主動群益台灣強棒', '群益投信', lambda day, latest: fetch_capital('399', day, latest)),
              ('00992A', '主動群益科技創新', '群益投信', lambda day, latest: fetch_capital('500', day, latest)),
          ]

          def load(day_iso):
              path = f'tpex/etf-{day_iso}.json'
              try:
                  return json.load(open(path, encoding='utf-8'))
              except Exception:  # noqa: BLE001
                  return {'date': day_iso, 'etfs': {}}

          def store(day_iso, code, name, issuer, item):
              doc = load(day_iso)
              doc['etfs'][code] = {'name': name, 'issuer': issuer, **item}
              doc['generatedAt'] = datetime.now(TW).isoformat(timespec='seconds')
              json.dump(doc, open(f'tpex/etf-{day_iso}.json', 'w', encoding='utf-8'), ensure_ascii=False, separators=(',', ':'))
              try:
                  index = json.load(open('tpex/etf-index.json', encoding='utf-8'))
              except Exception:  # noqa: BLE001
                  index = []
              index = sorted(set(index) | {day_iso}, reverse=True)[:60]
              json.dump(index, open('tpex/etf-index.json', 'w', encoding='utf-8'))

          for day in days:
              latest = day == days[-1]
              day_iso = day.isoformat()
              existing = load(day_iso).get('etfs') or {}
              for code, name, issuer, fetch in ETFS:
                  if not latest and code in existing and len(existing[code].get('rows') or []) >= 5:
                      continue
                  try:
                      date, item = fetch(day, latest)
                      if not date or len(item['rows']) < 5:
                          print(day_iso, code, 'no data', date, len(item['rows']))
                          continue
                      if not latest and date != day_iso:
                          print(day_iso, code, 'date mismatch', date)
                          continue
                      store(date, code, name, issuer, item)
                      print(day_iso, code, 'ok', date, len(item['rows']), item['source'])
                  except Exception as e:  # noqa: BLE001
                      print(day_iso, code, 'failed', type(e).__name__, str(e)[:120])
                      if latest:
                          try:
                              date, item = fetch_fallback(code)
                              if date and len(item['rows']) >= 5:
                                  store(date, code, name, issuer, item)
                                  print(day_iso, code, 'fallback ok', date, len(item['rows']))
                          except Exception as e2:  # noqa: BLE001
                              print(day_iso, code, 'fallback failed', type(e2).__name__, str(e2)[:120])
                  time.sleep(3)
          PY
      - name: 推到 data 分支
        run: |
          git config user.name "etf-mirror"
          git config user.email "etf-mirror@users.noreply.github.com"
          git add tpex
          git commit -m "主動式 ETF 持股鏡像 $(date -u +%Y-%m-%dT%H:%MZ)" || echo "沒有變動"
          git push
      - name: 戳後端立刻拉回去
        run: |
          curl -sS -X POST --max-time 170 "https://hanstock-production-b872.up.railway.app/api/hub/etf/collect" -o /tmp/etf.json -w "HTTP %{http_code}\n" || true
          head -c 3000 /tmp/etf.json; echo
