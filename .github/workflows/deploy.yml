# 推到 main 就自動部署到 Cloudflare Workers，不用再在電腦上手動 git pull + npx wrangler deploy。
# 需要先在 GitHub 這個 repo 的 Settings → Secrets and variables → Actions 新增：
#   CLOUDFLARE_API_TOKEN   （Cloudflare 儀表板 → My Profile → API Tokens → Create Token → 用「Edit Cloudflare Workers」範本）
#   CLOUDFLARE_ACCOUNT_ID  （Workers & Pages 頁面右側的 Account ID；帳號只有一個時可以不設）
# 沒設 token 時這個工作只會印一行提示、不會失敗。
name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-tw-groups
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      # 貼金鑰時常會多帶到換行、空白，甚至整段 curl 指令（2026-09-22 就是這樣，wrangler 報
      # "invalid header value" / "Invalid format for Authorization header"）。這裡從貼進來的內容裡
      # 抓出那一串 40 個字的權杖，先跟 Cloudflare 驗證一次，不對就用看得懂的話說明怎麼修。
      - name: 整理並驗證金鑰
        run: |
          raw="$RAW_CLOUDFLARE_API_TOKEN"
          if [ -z "$(printf '%s' "$raw" | tr -d '[:space:]')" ]; then
            echo "::notice::尚未設定 CLOUDFLARE_API_TOKEN secret，這次不部署。到 Settings → Secrets and variables → Actions 新增後，重新執行這個 workflow 即可。"
            echo "CLOUDFLARE_API_TOKEN=" >> "$GITHUB_ENV"
            exit 0
          fi
          # 權杖是 40 個英數字元。貼進來的內容可能前後黏著別的字（例如 Bearer、引號、指令），
          # 所以把每一段夠長的英數字串裡所有 40 字的視窗都拿去 Cloudflare 驗證，找到 active 的就用。
          token=""
          last_verify=""
          # 診斷（不會印出金鑰本身）：貼進來的內容有幾行、每行長度與字元樣式（英文→a、數字→0，其他照印）
          echo "秘密內容共 $(printf '%s\n' "$raw" | wc -l) 行："
          printf '%s\n' "$raw" | while IFS= read -r line; do
            shape="$(printf '%s' "$line" | sed -E 's/[A-Za-z]/a/g; s/[0-9]/0/g')"
            echo "  長度 ${#line}：$shape"
          done
          candidates="$(printf '%s' "$raw" | grep -oE '[A-Za-z0-9_-]{40,}' || true)"
          echo "找到 $(printf '%s\n' "$candidates" | grep -c . || true) 段長度 ≥ 40 的英數字串"
          if [ -z "$candidates" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN 的內容不像 Cloudflare API 權杖（應該是一串 40 個英數字元）。請到 Cloudflare → 我的設定檔 → API 權杖重新建立一個，只複製那一串權杖，再到 GitHub 的 secret 按鉛筆圖示重新貼上。"
            exit 1
          fi
          # 2026 的權杖不一定是 40 字（實際看到 53 字、前面有 4 個字母加底線的前綴），所以先拿整段試，
          # 整段不行再試 40 字的視窗（舊格式權杖前後黏了別的字的情況）。
          try_token() {
            verify="$(curl -sS "https://api.cloudflare.com/client/v4/user/tokens/verify" -H "Authorization: Bearer $1" || true)"
            last_verify="$verify"
            echo "  候選（長度 ${#1}）→ $verify"
            printf '%s' "$verify" | grep -q '"status":"active"'
          }
          while IFS= read -r run; do
            if try_token "$run"; then token="$run"; break; fi
            len=${#run}
            i=0
            while [ $((i + 40)) -lt "$len" ] && [ -z "$token" ]; do
              cand="${run:$i:40}"
              if try_token "$cand"; then token="$cand"; fi
              i=$((i + 1))
            done
            [ -n "$token" ] && break
          done <<< "$candidates"
          if [ -z "$token" ]; then
            echo "::error::Cloudflare 不接受這個金鑰：$last_verify 。請重新建立一個「編輯 Cloudflare Workers」範本的權杖，只複製那一串權杖，再到 GitHub 的 secret 按鉛筆圖示重新貼上。"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "金鑰驗證成功。"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$(printf '%s' "$RAW_CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22

      - name: 檢查打包結果
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: node --check src/index.js

      - name: 部署
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 deploy
